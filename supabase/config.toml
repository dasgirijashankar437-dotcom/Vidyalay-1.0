# Vidyalay 1.0 Supabase CLI configuration.
# Link this project to your real Supabase project after creating it:
# supabase link --project-ref YOUR_PROJECT_REF
project_id = "vidyalay-1-0"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8000"
additional_redirect_urls = ["http://localhost:8000/**", "https://YOUR_GITHUB_PAGES_HOST/**"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
